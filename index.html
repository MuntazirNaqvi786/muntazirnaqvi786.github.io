<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muntazir Naqvi ~ console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a1018;
    --panel: #0e1620;
    --panel-edge: #1c2a38;
    --amber: #ffb454;
    --amber-dim: #a97a3a;
    --cyan: #5eeaD4;
    --text: #c7d1db;
    --text-dim: #647184;
    --danger: #ff6b6b;
    --good: #5eeaD4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{
    font-family:'JetBrains Mono', monospace;
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:28px 16px 60px;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(94,234,212,0.05), transparent 60%),
      var(--bg);
  }

  /* ---------- Status ticker ---------- */
  .statusbar{
    width:100%;
    max-width:880px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--text-dim);
    padding:0 6px 10px;
    border-bottom:1px solid var(--panel-edge);
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:6px;
  }
  .statusbar .dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--good);margin-right:6px;
    box-shadow:0 0 8px var(--good);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .statusbar span.metric b{color:var(--amber);font-weight:500;}
  .statusbar .metric{margin-right:14px;}

  /* ---------- Console frame ---------- */
  .console{
    width:100%;
    max-width:880px;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:6px;
    box-shadow:0 0 0 1px rgba(0,0,0,0.4), 0 30px 80px -30px rgba(0,0,0,0.7);
    overflow:hidden;
  }
  .console-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#0c1420;
    border-bottom:1px solid var(--panel-edge);
    padding:9px 14px;
    font-size:12px;
    color:var(--text-dim);
  }
  .console-head .tabs{display:flex;gap:2px;}
  .console-head .tab{
    padding:4px 12px;
    font-size:11px;
    border-radius:4px 4px 0 0;
    color:var(--text-dim);
  }
  .console-head .tab.active{background:var(--panel);color:var(--amber);}
  .console-head .path{color:var(--text-dim);}

  .console-body{
    padding:20px 22px 16px;
    min-height:460px;
    max-height:62vh;
    overflow-y:auto;
    font-size:14px;
    line-height:1.65;
  }
  .console-body::-webkit-scrollbar{width:8px;}
  .console-body::-webkit-scrollbar-thumb{background:var(--panel-edge);border-radius:4px;}

  .line{white-space:pre-wrap;word-break:break-word;margin:0 0 2px;}
  .prompt{color:var(--cyan);}
  .prompt .user{color:var(--amber);}
  .cmd-echo{color:var(--text);}
  .out{color:var(--text);margin-bottom:10px;white-space:pre-wrap;}
  .out .h{color:var(--amber);font-weight:700;display:block;margin-bottom:8px;}
  .out .dim{color:var(--text-dim);}
  .out .cyan{color:var(--cyan);}
  .out a{color:var(--cyan);text-decoration:none;border-bottom:1px dotted var(--cyan);}
  .out a:hover{color:var(--amber);border-color:var(--amber);}
  .out .bad{color:var(--danger);}
  .banner{color:var(--amber);font-size:12px;line-height:1.3;margin-bottom:14px;white-space:pre;}
  ul.clean{margin:4px 0 10px 0;padding-left:18px;}
  ul.clean li{margin-bottom:3px;}
  .tag{
    display:inline-block;
    border:1px solid var(--panel-edge);
    color:var(--cyan);
    padding:1px 7px;
    border-radius:3px;
    font-size:12px;
    margin:2px 4px 2px 0;
  }
  .job{margin-bottom:16px;}
  .job-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    column-gap:16px;
  }
  .job-row .job-title{color:var(--cyan);}
  .job-row .job-title b{color:var(--cyan);font-weight:700;}
  .job-row .job-date{color:var(--text-dim);white-space:nowrap;}
  .job-body{margin-top:2px;}
  .cert-row{margin-bottom:4px;}
  .help-row{display:flex;gap:14px;margin-bottom:3px;flex-wrap:wrap;}
  .help-cmd{color:var(--cyan);min-width:118px;flex-shrink:0;}
  .help-star{color:var(--amber);}

  .input-row{
    display:flex;
    align-items:center;
    border-top:1px solid var(--panel-edge);
    padding:10px 22px;
    gap:8px;
  }
  .input-row .prompt{white-space:nowrap;}
  .input-row input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
  }
  .cursor{
    display:inline-block;width:8px;height:16px;background:var(--amber);
    animation:blink 1s step-end infinite;vertical-align:-3px;
  }
  @keyframes blink{50%{opacity:0;}}

  .hint{
    max-width:880px;width:100%;
    font-size:11.5px;
    color:var(--text-dim);
    margin-top:12px;
    padding:0 6px;
  }
  .hint .tag{cursor:pointer;}
  .hint .tag:hover{border-color:var(--amber);color:var(--amber);}

  @media (max-width:600px){
    .console-body{font-size:13px;padding:16px;}
    .statusbar{font-size:10px;}
  }
</style>
</head>

const order = ["about","skills","experience","education","certifications","languages","resume","contact","social"];

function helpText(){
  const rows = [
    ["about", "Personal info & introduction"],
    ["experience", "Work history & companies"],
    ["education", "Educational background"],
    ["skill", "Technical expertise & tools"],
    ["certification", "Certifications held"],
    ["learned", "What I've learned along the way"],
    ["languages", "Language proficiency"],
    ["contact", "Contact details & socials"],

    ["social", "LinkedIn & other links"],
    ["whoami", "Show current user info"],
    ["clear", "Clear screen (resets banner)"],
    ["help", "Show this list"],
  ];
  const list = rows.map(([cmd, desc]) =>
    `<div class="help-row"><span class="help-cmd">${cmd}</span><span>${desc}</span></div>`
  ).join('');
  return `<span class="h">📌 AVAILABLE COMMANDS</span>${list}`;
}

function print(html, cls){
  const div = document.createElement('div');
  div.className = cls || 'out';
  div.innerHTML = html;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function printLine(text, cls){
  const div = document.createElement('div');
  div.className = cls || 'line';
  div.textContent = text;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function run(raw){
  const c = raw.trim().toLowerCase();
  printLine(`Muntazir Naqvi:~$ ${raw}`, 'line cmd-echo');
  if(!c) return;
  if(c === 'clear'){ body.innerHTML = ''; return; }
  if(c === 'help'){ print(helpText()); return; }
  if(c === 'download resume' || c === 'cat resume.pdf' || c === 'resume.pdf'){ print(data.resume); return; }
  const aliases = {
    summary: 'about',
    skill: 'skills',
    certification: 'certifications',
    "what i've learned": 'learned',
    "what i learned": 'learned',
    "whatilearned": 'learned'
  };
  const key = aliases[c] || c;
  if(data[key]){ print(data[key]); return; }
  if(c === 'sudo' || c.startsWith('sudo ')){
    print(`<span class="bad">Nice try. This user doesn't need root — automation already handles it.</span>`);
    return;
  }
  print(`<span class="bad">command not found:</span> ${c}. type <span class="cyan">help</span> for a list.`);
}

input.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    const v = input.value;
    input.value = '';
    run(v);
  }
});

document.querySelectorAll('.hint .tag').forEach(el=>{
  el.addEventListener('click', ()=>{ input.value = el.dataset.c; input.focus(); run(el.dataset.c); input.value=''; });
});

document.addEventListener('click', ()=> input.focus());

})();
